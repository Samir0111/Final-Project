<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 5px;
            overflow: hidden;
        }

        .email-header {
            background-color: #ff8500;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .email-body {
            padding: 20px;
            text-align: center;
        }

            .email-body p {
                font-size: 16px;
                color: #333333;
            }

            .email-body a {
                display: inline-block;
                margin: 20px 0;
                padding: 10px 20px;
                color: white;
                background-color: #ff8500;
                text-decoration: none;
                border-radius: 5px;
            }

        .email-footer {
            text-align: center;
            font-size: 12px;
            color: #aaaaaa;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1>Password Reset</h1>
        </div>
        <div class="email-body">
            <p>Hi,</p>
            <p>You requested a password reset. Click the button below to reset your password:</p>
            <a href="{{reset-link}}" target="_blank">Reset Password</a>
            <p>If you didn’t request this, you can ignore this email.</p>
        </div>
        <div class="email-footer">
            <p>&copy; 2025 Your Application Name. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
